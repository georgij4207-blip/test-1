<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Искорка: чертёжный забег</title>
<style>
  html,body{margin:0;height:100%;background:#123574;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;justify-content:center;align-items:flex-start}
  canvas{display:block;touch-action:none}
  .safe{position:fixed;left:0;width:0;pointer-events:none;visibility:hidden}
  #sa{top:0;height:env(safe-area-inset-top,0px)}
  #sb{bottom:0;height:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa" class="safe"></div><div id="sb" class="safe"></div>
<script>
'use strict';
/* ================= базовое ================= */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const FONT = '"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const COL = {
  sky: '#1f51a3', ground: '#1b4794', road: '#2357aa',
  face: '#2a63b9', top: '#3572c9', side: '#2459ab', paper: '#3a7bd6',
  ink: '#0b1a3e', hole: '#06122e', white: '#f4f8ff',
  orange: '#ff8a1e', core: '#ffc34d', accent: '#ffb35a'
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = (k, dt) => 1 - Math.exp(-k * dt);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ================= экран и проекция ================= */
let W = 0, H = 0, DPR = 1, U = 1, HY = 0, GY = 0, S0 = 0, CAMH = 0, F = 0, safeT = 0, safeB = 0;
const CD = 5.5;            // расстояние камеры за персонажем
let camX = 0, camY = 0;    // смещение камеры
let lineGrad = null;       // градиент «затухания» разметки к горизонту

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  W = Math.min(vw, Math.round(vh * 0.68));
  H = vh;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  U = W / 390;
  HY = H * 0.30; GY = H * 0.79;
  S0 = W * 0.29;                 // пикселей на единицу мира у ног искорки
  CAMH = (GY - HY) / S0;
  F = S0 * CD;
  safeT = document.getElementById('sa').offsetHeight || 0;
  safeB = document.getElementById('sb').offsetHeight || 0;
  lineGrad = ctx.createLinearGradient(0, HY, 0, HY + (GY - HY) * 0.55);
  lineGrad.addColorStop(0, 'rgba(244,248,255,0)');
  lineGrad.addColorStop(1, 'rgba(244,248,255,1)');
}
// мир: x — вбок (полосы -1, 0, 1), y — вверх, z — вперёд от искорки
function P(x, y, z) {
  const s = F / Math.max(0.06, z + CD);
  return { x: W / 2 + (x - camX) * s, y: HY + (CAMH + camY - y) * s, s };
}
const LW = s => clamp(0.028 * s, 1, 3.4 * U);

/* ================= звук ================= */
let AC = null, master = null, muted = false;
try { muted = localStorage.getItem('spark_mute') === '1'; } catch (e) {}
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq) {
  if (!AC || muted) return;
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8; g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
let nutCombo = 0, nutComboT = 0;
function sfx(n) {
  switch (n) {
    case 'jump': tone(320, 720, 0.16, 'sine', 0.35); break;
    case 'land': tone(160, 70, 0.08, 'sine', 0.3); break;
    case 'lane': tone(900, 1300, 0.05, 'triangle', 0.12); break;
    case 'slide': noise(0.22, 0.5, 1800); tone(500, 200, 0.18, 'triangle', 0.1); break;
    case 'nut': tone(1100 + nutCombo * 70, 1500 + nutCombo * 90, 0.09, 'square', 0.07); break;
    case 'bump': tone(220, 110, 0.14, 'square', 0.15); noise(0.1, 0.4, 600); break;
    case 'door': tone(784, 784, 0.25, 'sine', 0.25); tone(622, 622, 0.4, 'sine', 0.25, 0.22); break;
    case 'crash': noise(0.45, 0.9, 500); tone(300, 50, 0.45, 'sawtooth', 0.18); break;
    case 'fall': tone(900, 90, 0.8, 'sine', 0.25); break;
    case 'sheet': tone(660, 660, 0.08, 'triangle', 0.15); tone(990, 990, 0.14, 'triangle', 0.15, 0.08); break;
  }
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ================= состояние ================= */
let state = 'menu';          // menu | play | dead | pause
let T = 0, gameT = 0, speed = 0, dist = 0, score = 0, deadT = 0, shake = 0;
let best = 0;
try { best = +localStorage.getItem('spark_best') || 0; } catch (e) {}
let objs = [], props = [], dims = [], parts = [], pops = [], labels = [];
let nextRow = 0, rowN = 0, nextProp = 0, nextDim = 0, lastGag = 0, dimN = 0, sheetN = 1;
let seen = {}, hints = {}, deathCause = '', deathType = '', newBest = false, lastSign = '';

const G = 25, JV = 7.8;                       // прыжок: высота ≈ 1.2, полёт ≈ 0.62 с
const pl = {};
function resetPlayer() {
  Object.assign(pl, { lane: 1, x: 0, y: 0, vy: 0, air: false, slide: 0, sl: 0, slideQ: false,
    jumpBuf: 0, sq: 0, sqv: 0, ph: 0, tilt: 0, fall: 0, emit: 0 });
}
function reset() {
  objs = []; props = []; dims = []; parts = []; pops = [];
  speed = 9; dist = 0; score = 0; gameT = 0; rowN = 0; lastGag = 0; dimN = 0; sheetN = 1;
  nextRow = 30; nextProp = 5; nextDim = 10;
  seen = {}; hints = {}; newBest = false;
  resetPlayer();
  spawnAhead();
}

/* ================= генерация ================= */
const SPEC = {
  roll:  { d: 0.62, h: 0.5,  cls: 'low' },
  blot:  { d: 1.0,  h: 0.14, cls: 'low' },
  hole:  { d: 0.9,  h: 0.14, cls: 'low' },
  gate:  { d: 0.22, cls: 'high' },
  books: { d: 0.9,  cls: 'wall' },
  door:  { d: 0.2,  cls: 'gag' }
};
const LABELS = {
  roll: ['рулоны ватмана', 'ватман А1, 2 рулона'],
  blot: ['клякса туши', 'клякса (свежая)'],
  hole: ['переносная дыра', 'дыра переносная, 1 шт.'],
  gate: ['линейка, 30 см', 'лист А3 на линейке'],
  books: ['СНиП, тт. 1–5', 'гранит науки', 'справочник, h = 2 м'],
  door: ['дверь. стену не завезли', 'дверь (стена — в след. версии)']
};
const HINT = { low: 'прыгай ↑', high: 'пригнись ↓', wall: 'обходи ← →' };
const CAUSE = {
  roll: 'споткнулась о рулоны ватмана',
  blot: 'вляпалась в кляксу туши',
  hole: 'провалилась в переносную дыру',
  gate: 'получила линейкой по лбу',
  books: 'разбилась о гранит науки'
};
const SIGNS = ['КОНЕЦ ЧЕРТЕЖА →', 'МАСШТАБ НЕ СОБЛЮДЁН', 'ЗДЕСЬ БЫЛ ЧЕРТЁЖНИК', 'НЕ ПО ГОСТу', 'ОСТОРОЖНО: ПЕРСПЕКТИВА', 'ЛАСТИК НЕ ПОМОЖЕТ'];

function pickLow() { const r = Math.random(); return r < 0.55 ? 'roll' : r < 0.86 ? 'blot' : 'hole'; }
function pickType() { const r = Math.random(); return r < 0.4 ? pickLow() : r < 0.68 ? 'gate' : 'books'; }

function addObs(type, l, z, canLabel) {
  const sp = SPEC[type];
  const o = { kind: 'obs', type, lane: l, x: l - 1, z, d: sp.d, h: sp.h || 0, cls: sp.cls,
    a: 0, pz: false, px: false, seed: Math.random() * 1000, ang: 0, dir: l === 0 ? -1 : l === 2 ? 1 : (Math.random() < 0.5 ? -1 : 1) };
  if (type === 'books') {
    o.books = []; let y = 0;
    for (let i = 0; i < 5; i++) {
      const h = 0.33 + Math.random() * 0.12;
      o.books.push({ h, w: 0.78 + Math.random() * 0.16, dx: (Math.random() - 0.5) * 0.1, dz: (Math.random() - 0.5) * 0.1,
        dp: 0.72 + Math.random() * 0.12, spine: Math.random() < 0.55 });
      y += h;
    }
  }
  if (type === 'blot') {
    o.ph = [Math.random() * 6, Math.random() * 6, Math.random() * 6];
    o.drops = [];
    for (let i = 0; i < 3; i++) { const a = Math.random() * 6.28; o.drops.push({ a, r: 0.55 + Math.random() * 0.15, s: 0.04 + Math.random() * 0.04 }); }
  }
  if ((canLabel && (!seen[type] || Math.random() < 0.2)) || type === 'door') {
    o.label = pick(LABELS[type]); seen[type] = 1;
    if (HINT[sp.cls] && (hints[sp.cls] || 0) < 2) { o.hint = HINT[sp.cls]; hints[sp.cls] = (hints[sp.cls] || 0) + 1; }
  }
  objs.push(o);
  return o;
}
function addNut(x, y, z) { objs.push({ kind: 'nut', x, y, z, a: 0, seed: Math.random() * 6, got: false }); }

function genRow(z) {
  rowN++;
  const diff = Math.min(1, gameT / 150);
  let gapT = 1.3 - 0.48 * diff, row = [null, null, null];
  if (rowN === 1) { row = [null, 'roll', null]; gapT = 1.8; }
  else if (rowN === 2) { row = [null, 'books', null]; gapT = 1.8; }
  else if (rowN === 3) { row = ['gate', 'gate', 'gate']; gapT = 1.7; }
  else if (rowN === 4) { row = ['blot', 'roll', 'blot']; gapT = 1.6; }
  else {
    const r = Math.random();
    if (r < 0.08 && rowN > 6 && rowN - lastGag > 7) {
      lastGag = rowN; row[Math.floor(Math.random() * 3)] = 'door'; gapT += 0.2;
    } else if (r < 0.2) {
      const lowRow = Math.random() < 0.5;
      for (let l = 0; l < 3; l++) row[l] = lowRow ? pickLow() : 'gate';
    } else {
      const n = Math.random() < 0.4 + 0.3 * diff ? 2 : 1;
      const lanes = [0, 1, 2].sort(() => Math.random() - 0.5).slice(0, n);
      for (const l of lanes) row[l] = pickType();
    }
  }
  let labeled = false;
  const order = [0, 1, 2].sort(() => Math.random() - 0.5);
  for (const l of order) if (row[l]) { const o = addObs(row[l], l, z, !labeled); if (o.label) labeled = true; }
  // гайки: дугой над низким препятствием или цепочкой по свободной полосе
  const lows = [0, 1, 2].filter(l => row[l] && SPEC[row[l]].cls === 'low');
  const free = [0, 1, 2].filter(l => !row[l]);
  if (lows.length && (rowN === 1 || Math.random() < 0.35)) {
    const l = rowN === 1 ? 1 : pick(lows);
    for (let i = 0; i < 5; i++) { const u = -1 + i * 0.5; addNut(l - 1, 0.5 + 0.8 * (1 - u * u), z + u * speed * 0.27); }
  } else if (free.length && Math.random() < 0.55) {
    const l = pick(free);
    for (let i = 0; i < 5; i++) addNut(l - 1, 0.5, z + 1.6 + i * 1.3);
  }
  const walls = row.filter(t => t === 'books').length;
  nextRow = z + speed * (gapT + (walls >= 2 ? 0.3 : 0) + Math.random() * 0.3 * (1 - diff * 0.5));
}

function addProp(z) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const r = Math.random();
  const type = r < 0.3 ? 'pencil' : r < 0.58 ? 'square' : r < 0.82 ? 'compass' : 'sign';
  const p = { kind: 'prop', type, side, x: side * (2.3 + Math.random() * 0.5), z, a: 0, lean: (Math.random() - 0.5) * 0.16 };
  if (type === 'sign') { let t; do { t = pick(SIGNS); } while (t === lastSign); lastSign = t; p.text = t; p.x = side * 2.55; }
  props.push(p);
}
function addDim(z) {
  dimN++;
  const kind = dimN % 3 === 0 ? 'cross' : 'long';
  const side = dimN % 2 ? -1 : 1;
  let text = kind === 'cross' ? '3000' : '10 000';
  if (kind === 'long' && Math.random() < 0.18) text = pick(['≈ далеко', '10 000 ± чуть-чуть', 'много']);
  dims.push({ kind, side, z, text });
}
const SPAWN = 64;
function spawnAhead() {
  while (nextProp < SPAWN) { addProp(nextProp); nextProp += 15 + Math.random() * 16; }
  while (nextDim < SPAWN) { addDim(nextDim); nextDim += 32 + Math.random() * 18; }
  if (state === 'play') while (nextRow < SPAWN) genRow(nextRow);
}

/* ================= управление ================= */
function doJump() {
  pl.air = true; pl.vy = JV; pl.slide = 0; pl.slideQ = false; pl.jumpBuf = 0;
  pl.sqv -= 6; sfx('jump');
}
function startSlide() { pl.slide = 0.62; pl.sqv += 2; sfx('slide'); }
function act(dir) {
  if (dir === 'left' || dir === 'right') {
    const nl = clamp(pl.lane + (dir === 'left' ? -1 : 1), 0, 2);
    if (nl !== pl.lane) { pl.lane = nl; sfx('lane'); }
  } else if (dir === 'up') {
    if (!pl.air) doJump(); else pl.jumpBuf = 0.2;
  } else if (dir === 'down') {
    if (pl.air) { pl.vy = Math.min(pl.vy, -14); pl.slideQ = true; pl.jumpBuf = 0; }
    else startSlide();
  }
}
function startGame() { reset(); state = 'play'; }
function swipe(dir) {
  if (state === 'menu') { startGame(); return; }
  if (state === 'pause') { state = 'play'; return; }
  if (state === 'dead') { if (deadT > 0.8) startGame(); return; }
  act(dir);
}
function muteRect() { const s = 34 * U; return { x: W - 14 * U - s, y: safeT + 74 * U, w: s, h: s }; }
function tap(x, y) {
  const m = muteRect();
  if (state !== 'menu' && x > m.x - 8 && x < m.x + m.w + 8 && y > m.y - 8 && y < m.y + m.h + 8) {
    muted = !muted; try { localStorage.setItem('spark_mute', muted ? '1' : '0'); } catch (e) {}
    return;
  }
  if (state === 'menu') startGame();
  else if (state === 'pause') state = 'play';
  else if (state === 'dead' && deadT > 0.8) startGame();
}
let ptr = null;
function localXY(e) { const r = cvs.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
}, { passive: false });
cvs.addEventListener('pointermove', e => {
  if (!ptr || ptr.done || e.pointerId !== ptr.id) return;
  e.preventDefault();
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, th = Math.max(16, 24 * U);
  if (dx * dx + dy * dy > th * th) {
    ptr.done = true;
    swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }
}, { passive: false });
cvs.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.done) {
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    if (dx * dx + dy * dy > 100) swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    else { const [x, y] = localXY(e); tap(x, y); }
  }
  ptr = null;
});
cvs.addEventListener('pointercancel', () => { ptr = null; });
['contextmenu', 'gesturestart', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
window.addEventListener('keydown', e => {
  const k = e.key;
  const map = { ArrowLeft: 'left', a: 'left', 'ф': 'left', ArrowRight: 'right', d: 'right', 'в': 'right',
    ArrowUp: 'up', w: 'up', 'ц': 'up', ' ': 'up', ArrowDown: 'down', s: 'down', 'ы': 'down' };
  const dir = map[k] || map[k.toLowerCase && k.toLowerCase()];
  if (dir || k === 'Enter') { e.preventDefault(); audioInit(); if (!e.repeat) swipe(dir || 'up'); }
  if (k === 'm' || k === 'ь') { muted = !muted; }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
window.addEventListener('blur', () => { if (state === 'play') state = 'pause'; });

/* ================= логика ================= */
function pop(text, x, y, big, color) { pops.push({ text, x, y, t: 0, big: !!big, color: color || COL.white }); }
function blocked(o) {
  if (o.cls === 'low') return pl.y < o.h;
  if (o.cls === 'high') return pl.slide <= 0;
  return true;
}
function die(o) {
  state = 'dead'; deadT = 0; deathType = o.type; deathCause = CAUSE[o.type];
  shake = o.type === 'hole' ? 0.15 : 0.55;
  if (o.type === 'hole') { sfx('fall'); pl.slide = 0; }
  else { sfx('crash'); pl.air = true; pl.vy = 4.5; pl.slide = 0; pl.slideQ = false; }
  buzz(o.type === 'hole' ? 40 : 120);
  const p = P(pl.x, 0.9, 0);
  const word = o.type === 'blot' ? 'ПЛЮХ!' : o.type === 'hole' ? 'ой-ой…' : o.type === 'gate' ? 'ДЗЫНЬ!' : 'БАХ!';
  pop(word, p.x, p.y - 30 * U, true);
  if (score > best) { best = Math.floor(score); newBest = true; try { localStorage.setItem('spark_best', best); } catch (e) {} }
}
function collide() {
  for (const o of objs) {
    if (o.kind === 'nut') {
      if (!o.got && Math.abs(o.z) < 0.45 && Math.abs(o.x - pl.x) < 0.5 && Math.abs(o.y - (pl.y + 0.55)) < 0.65) {
        o.got = true; score += 10; nutCombo = Math.min(nutCombo + 1, 10); nutComboT = 0.6; sfx('nut');
        for (let i = 0; i < 5; i++) parts.push({ k: 'plus', x: o.x, y: o.y, z: o.z, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 2, life: 0.35, max: 0.35 });
      }
      continue;
    }
    if (o.type === 'door') {
      if (!o.passed && o.z < 0) {
        o.passed = true;
        if (Math.abs(o.x - pl.x) < 0.45) { score += 25; sfx('door'); const p = P(pl.x, 1.4, 0); pop('+25 вежливо!', p.x, p.y, false, COL.accent); }
      }
      continue;
    }
    const zo = o.z - o.d / 2 < 0.2 && o.z + o.d / 2 > -0.2;
    const xo = Math.abs(o.x - pl.x) < 0.55;
    if (zo && xo && blocked(o)) {
      if (!o.pz) { die(o); return; }
      if (!o.px && !o.bounced) {
        o.bounced = true;
        pl.lane = clamp(o.lane + (pl.x < o.x ? -1 : 1), 0, 2);
        shake = 0.25; sfx('bump'); buzz(30);
        const p = P(pl.x, 1.3, 0); pop('ой!', p.x, p.y);
      }
    }
    o.pz = zo; o.px = xo;
  }
}
function moveWorld(mv) {
  for (const o of objs) o.z -= mv;
  for (const p of props) p.z -= mv;
  for (const d of dims) d.z -= mv;
  for (const p of parts) p.z -= mv;
  nextRow -= mv; nextProp -= mv; nextDim -= mv;
  objs = objs.filter(o => o.z > -2.4 && !(o.kind === 'nut' && o.got));
  props = props.filter(o => o.z > -2.6);
  dims = dims.filter(o => o.z > -14);
}
function updatePlayer(dt) {
  const tx = pl.lane - 1;
  pl.x += (tx - pl.x) * ease(17, dt);
  if (Math.abs(tx - pl.x) < 0.001) pl.x = tx;
  pl.tilt += (clamp((tx - pl.x) * 0.9, -0.5, 0.5) - pl.tilt) * ease(16, dt);
  if (pl.air) {
    pl.vy -= G * dt; pl.y += pl.vy * dt;
    if (pl.y <= 0) {
      const impact = clamp(-pl.vy / 12, 0.25, 1.3);
      pl.y = 0; pl.air = false; pl.sqv += 8 * impact;
      if (state === 'play') {
        sfx('land');

  ctx.fillStyle = COL.sky; ctx.fillRect((x0 + x1) / 2 - tw / 2 - 4, y - 8 * U, tw + 8, 16 * U);
  ctx.fillStyle = COL.white; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, (x0 + x1) / 2, y);
}
function drawMenu() {
  ctx.fillStyle = 'rgba(14,40,96,0.35)'; ctx.fillRect(0, 0, W, H);
  const ty = safeT + H * 0.13;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  setFont(15 * U, 600); ctx.fillStyle = 'rgba(244,248,255,0.8)'; ctx.fillText('ЧЕРТЁЖ № 1 · ЛИСТ 1 ИЗ ∞', W / 2, ty - 46 * U);
  setFont(58 * U, 800);
  ctx.lineWidth = 8 * U; ctx.strokeStyle = COL.ground; ctx.lineJoin = 'round'; ctx.strokeText('ИСКОРКА', W / 2, ty + 10 * U);
  ctx.fillStyle = COL.white; ctx.fillText('ИСКОРКА', W / 2, ty + 10 * U);
  const tw = ctx.measureText('ИСКОРКА').width;
  dimLine(W / 2 - tw / 2, W / 2 + tw / 2, ty + 32 * U, 'бег по ватману');
  // пульт
  const py = H * 0.39, bw = W * 0.8, bh = 128 * U, bx = (W - bw) / 2;
  ctx.fillStyle = 'rgba(20,56,122,0.9)'; ctx.fillRect(bx, py, bw, bh);
  ctx.strokeStyle = COL.white; ctx.lineWidth = 1.5 * U; ctx.strokeRect(bx, py, bw, bh);
  ctx.beginPath(); ctx.moveTo(bx + bw * 0.34, py); ctx.lineTo(bx + bw * 0.34, py + bh);
  for (let i = 1; i < 4; i++) { ctx.moveTo(bx, py + bh * i / 4); ctx.lineTo(bx + bw, py + bh * i / 4); } ctx.stroke();
  const rows = [['СВАЙП', 'ДЕЙСТВИЕ'], ['← →', 'сменить полосу'], ['↑', 'прыжок через низкое'], ['↓', 'подкат под высокое']];
  rows.forEach((r, i) => {
    const yy = py + bh * (i + 0.5) / 4;
    ctx.textBaseline = 'middle';
    setFont((i ? 17 : 11) * U, i ? 700 : 600); ctx.fillStyle = i ? COL.accent : 'rgba(244,248,255,0.75)'; ctx.textAlign = 'center';
    ctx.fillText(r[0], bx + bw * 0.17, yy);
    setFont((i ? 15 : 11) * U, i ? 500 : 600); ctx.fillStyle = i ? COL.white : 'rgba(244,248,255,0.75)'; ctx.textAlign = 'left';
    ctx.fillText(r[1], bx + bw * 0.34 + 10 * U, yy);
  });
  setFont(12 * U, 500); ctx.fillStyle = 'rgba(244,248,255,0.8)'; ctx.textAlign = 'center';
  ctx.fillText('стену из книг обходи сбоку', W / 2, py + bh + 18 * U);
  if (best > 0) { setFont(14 * U, 600); ctx.fillStyle = COL.white; ctx.fillText('рекорд: ' + best, W / 2, py + bh + 40 * U); }
  const pb = P(pl.x, 0, 0);
  drawLeader(pb.x + 0.3 * pb.s, pb.y - 0.7 * pb.s, pb.x + 0.75 * pb.s, pb.y - 1.25 * pb.s, 'искорка, 1 шт.', 'бежит сама', 1, 1);
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 3.2);
  setFont(20 * U, 700); ctx.fillStyle = COL.white; ctx.textBaseline = 'alphabetic';
  ctx.fillText('свайпни, чтобы начать', W / 2, H - safeB - 34 * U);
  ctx.globalAlpha = 1;
}
function drawDead() {
  const k = clamp((deadT - 0.6) / 0.3, 0, 1); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(14,40,96,0.45)'; ctx.fillRect(0, 0, W, H);
  const bw = W * 0.86, bh = 236 * U, bx = (W - bw) / 2, by = H * 0.3 + (1 - k) * 20 * U;
  ctx.fillStyle = 'rgba(20,56,122,0.96)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = COL.white; ctx.lineWidth = 2 * U; ctx.strokeRect(bx, by, bw, bh);
  ctx.lineWidth = 1 * U; ctx.strokeRect(bx + 5 * U, by + 5 * U, bw - 10 * U, bh - 10 * U);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(26 * U, 800); ctx.fillStyle = COL.white; ctx.fillText('ЧЕРТЁЖ ИСПОРЧЕН', W / 2, by + 36 * U);
  setFont(15 * U, 500); ctx.fillStyle = COL.accent; ctx.fillText('искорка ' + deathCause, W / 2, by + 66 * U);
  const ty = by + 88 * U, rh = 44 * U;
  ctx.strokeStyle = COL.white; ctx.lineWidth = 1.2 * U;
  ctx.beginPath();
  ctx.moveTo(bx + 14 * U, ty); ctx.lineTo(bx + bw - 14 * U, ty);
  ctx.moveTo(bx + 14 * U, ty + rh); ctx.lineTo(bx + bw - 14 * U, ty + rh);
  ctx.moveTo(bx + 14 * U, ty + rh * 2); ctx.lineTo(bx + bw - 14 * U, ty + rh * 2);
  ctx.moveTo(bx + bw * 0.45, ty); ctx.lineTo(bx + bw * 0.45, ty + rh * 2); ctx.stroke();
  ctx.textAlign = 'left'; setFont(13 * U, 600); ctx.fillStyle = 'rgba(244,248,255,0.8)';
  ctx.fillText('СЧЁТ', bx + 24 * U, ty + rh / 2); ctx.fillText('РЕКОРД', bx + 24 * U, ty + rh * 1.5);
  setFont(26 * U, 800); ctx.fillStyle = COL.white;
  ctx.fillText(String(Math.floor(score)), bx + bw * 0.45 + 14 * U, ty + rh / 2);
  setFont(20 * U, 700); ctx.fillText(String(best), bx + bw * 0.45 + 14 * U, ty + rh * 1.5);
  if (newBest) {
    ctx.save(); ctx.translate(bx + bw - 62 * U, ty + rh * 0.55); ctx.rotate(-0.16);
    ctx.strokeStyle = COL.orange; ctx.lineWidth = 2.5 * U; ctx.strokeRect(-56 * U, -17 * U, 112 * U, 34 * U);
    setFont(13 * U, 800); ctx.fillStyle = COL.orange; ctx.textAlign = 'center'; ctx.fillText('НОВЫЙ РЕКОРД', 0, 1); ctx.restore();
  }
  if (deadT > 0.8) {
    ctx.globalAlpha = k * (0.55 + 0.45 * Math.sin(T * 3.2));
    setFont(17 * U, 700); ctx.fillStyle = COL.white; ctx.textAlign = 'center';
    ctx.fillText('тапни, чтобы перечертить', W / 2, by + bh - 26 * U);
  }
  ctx.restore();
}
function drawPause() {
  ctx.fillStyle = 'rgba(14,40,96,0.5)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  setFont(34 * U, 800); ctx.fillStyle = COL.white; ctx.fillText('ПАУЗА', W / 2, H * 0.42);
  setFont(16 * U, 500); ctx.fillText('чертёжник отошёл за чаем', W / 2, H * 0.42 + 36 * U);
  setFont(18 * U, 700); ctx.fillStyle = COL.accent; ctx.fillText('тапни, чтобы продолжить', W / 2, H * 0.42 + 74 * U);
}

/* ================= кадр ================= */
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.ground; ctx.fillRect(0, 0, W, H);
  const shx = shake > 0 ? Math.sin(T * 53) * shake * 9 * U : 0, shy = shake > 0 ? Math.cos(T * 41) * shake * 6 * U : 0;
  ctx.translate(shx, shy);
  labels = [];
  drawSky(); drawGround(); drawRoad(); drawDims();
  const list = [];
  for (const p of props) list.push(p);
  for (const o of objs) list.push(o);
  list.push({ kind: 'player', z: 0.001 });
  list.sort((a, b) => b.z - a.z);
  for (const o of list) {
    if (o.kind === 'prop') drawProp(o);
    else if (o.kind === 'nut') { ctx.globalAlpha = o.a * fade(o.z); drawNut(o); ctx.globalAlpha = 1; }
    else if (o.kind === 'obs') drawObs(o);
    else { drawPlayer(); drawParts(); }
  }
  drawLabels();
  drawPops();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawFrame();
  if (state === 'menu') drawMenu();
  else {
    drawHUD();
    if (state === 'dead') drawDead();
    if (state === 'pause') drawPause();
  }
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = last ? (now - last) / 1000 : 0; last = now;
  dt = clamp(dt, 0, 0.05);
  if (state !== 'pause' && dt > 0) {
    const n = Math.ceil(dt / (1 / 120)), h = dt / n;
    for (let i = 0; i < n; i++) update(h);
  }
  draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
reset();
requestAnimationFrame(frame);
</script>
